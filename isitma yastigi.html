<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isıtma Yastığı Simülasyonu</title>
<style>
  :root{
    --bg:#ffffff; --text:#111827; --text-secondary:#6b7280;
    --border:#d1d5db; --border-strong:#374151; --surface-1:#f3f4f6;
    --accent:#3b82f6; --danger:#ef4444; --warning:#f59e0b; --success:#10b981;
    --teal:#0d9488; --purple:#7c3aed; --coral:#f97316; --gray:#6b7280;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); margin:0; padding:24px;
    max-width:760px; margin-inline:auto;
  }
  h1{font-size:18px; margin:0 0 16px;}
  .controls{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px;}
  button{
    font-family:inherit; font-size:13px; padding:8px 14px; border-radius:8px;
    border:1px solid var(--border); background:var(--surface-1); color:var(--text);
    cursor:pointer;
  }
  button:hover{background:#e5e7eb;}
  button.active{background:var(--accent); color:white; border-color:var(--accent);}
  .slider-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  input[type=range]{flex:1;}
  .ratio-line{font-size:12px; color:var(--text-secondary); margin-bottom:12px;}
  svg{width:100%; height:auto; display:block; margin:8px 0;}
  .th{font-size:14px; font-weight:600; fill:var(--text);}
  .ts{font-size:11px; fill:var(--text-secondary);}
  .temp-row{display:flex; align-items:center; gap:16px; margin-top:12px;}
  .temp-num{font-size:26px; font-weight:600; min-width:64px;}
  .bar-wrap{flex:1; height:12px; background:var(--surface-1); border-radius:6px; overflow:hidden; position:relative;}
  .bar-fill{position:absolute; left:0; top:0; height:100%; width:0%; background:var(--accent); border-radius:6px; transition:width .2s;}
  .status-line{margin-top:10px; font-size:13px; color:var(--text-secondary);}
  .status-strong{margin-top:6px; font-size:13px; font-weight:600;}
</style>
</head>
<body>
 
<h1>Isıtma Yastığı — 6 Pin, MOSFET, PWM, Ayarlanabilir Max ve Bağımsız Güvenlik Katmanı</h1>
 
<div class="controls">
  <button id="playBtn" onclick="toggleSim()">▶️ Başlat</button>
  <button onclick="resetSim()">⟲ Reset</button>
  <button id="lvl0" onclick="setLevel(0)">Kapalı</button>
  <button id="lvl1" onclick="setLevel(1)">Seviye 1</button>
  <button id="lvl2" onclick="setLevel(2)">Seviye 2</button>
  <button id="lvl3" onclick="setLevel(3)">Seviye 3</button>
</div>
 
<div class="slider-row">
  <label style="font-size:13px;color:var(--text-secondary);white-space:nowrap">Maks sıcaklık</label>
  <input type="range" id="maxTemp" min="35" max="70" value="55" step="1" oninput="updateMax(this.value)">
  <span id="maxOut" style="font-size:13px;font-weight:500;min-width:34px">55°</span>
</div>
<div class="ratio-line" id="ratioOut"></div>
 
<svg viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
 
  <rect x="160" y="20" width="400" height="130" rx="10" fill="none" stroke="var(--border-strong)" stroke-width="1"/>
  <text class="th" x="360" y="10" text-anchor="middle" dominant-baseline="central">HEAT MAT</text>
 
  <rect x="190" y="65" width="170" height="50" rx="8" fill="none" stroke="var(--teal)" stroke-width="1.2"/>
  <text class="th" x="275" y="90" text-anchor="middle" dominant-baseline="central" fill="var(--teal)">Termistör NTC</text>
  <line x1="360" y1="90" x2="410" y2="90" stroke="var(--text-secondary)" stroke-width="1.5" marker-end="url(#arrow)"/>
 
  <g id="resGroup">
    <rect x="420" y="65" width="100" height="50" rx="8" fill="none" stroke="var(--coral)" stroke-width="1.2"/>
    <text class="th" x="470" y="90" text-anchor="middle" dominant-baseline="central" fill="var(--coral)">RES.</text>
  </g>
 
  <path id="wire12" d="M220 150 C 160 220, 140 260, 300 340" fill="none" stroke="var(--border)" stroke-width="3" marker-end="url(#arrow)"/>
  <path id="wire34" d="M260 150 C 220 230, 220 280, 330 340" fill="none" stroke="var(--danger)" stroke-width="2" marker-end="url(#arrow)"/>
  <path id="wire56" d="M300 150 C 280 240, 220 300, 220 340" fill="none" stroke="var(--warning)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle id="dataDot" r="5" fill="var(--danger)" opacity="0"/>
  <text class="ts" x="90" y="160" fill="var(--accent)">1,2 güç çıkışı</text>
  <text class="ts" x="500" y="160" fill="var(--danger)">3,4 DATA</text>
  <text class="ts" x="90" y="330" fill="var(--warning)">5,6 POWER</text>
 
  <rect x="180" y="340" width="80" height="55" rx="8" fill="none" stroke="var(--border-strong)" stroke-width="1"/>
  <text class="th" id="mosLabel" x="220" y="360" text-anchor="middle" dominant-baseline="central">MOSFET</text>
  <text class="ts" id="mosState" x="220" y="378" text-anchor="middle" dominant-baseline="central">kapalı</text>
  <line x1="260" y1="367" x2="300" y2="367" id="gateLine" stroke="var(--border)" stroke-width="2"/>
 
  <rect x="300" y="340" width="160" height="55" rx="10" fill="none" stroke="var(--gray)" stroke-width="1.2"/>
  <text class="th" x="380" y="360" text-anchor="middle" dominant-baseline="central">CHIP</text>
  <text class="ts" id="chipState" x="380" y="378" text-anchor="middle" dominant-baseline="central">bekliyor</text>
 
  <line x1="60" y1="367" x2="180" y2="367" stroke="var(--text-secondary)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="th" x="40" y="367" text-anchor="middle" dominant-baseline="central">GNDS</text>
 
  <rect x="500" y="340" width="140" height="55" rx="10" fill="none" stroke="var(--purple)" stroke-width="1.2"/>
  <text class="th" x="570" y="360" text-anchor="middle" dominant-baseline="central" fill="var(--purple)">Levels</text>
  <text class="ts" id="lvlLabel" x="570" y="378" text-anchor="middle" dominant-baseline="central">kapalı</text>
  <line x1="500" y1="367" x2="460" y2="367" stroke="var(--text-secondary)" stroke-width="1.5" marker-end="url(#arrow)"/>
 
  <line x1="380" y1="455" x2="380" y2="395" stroke="var(--text-secondary)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="380" y="470" text-anchor="middle">POWER (Battery)</text>
 
  <rect id="safetyBox" x="80" y="490" width="540" height="55" rx="10" fill="none" stroke="var(--success)" stroke-width="1.5"/>
  <text class="th" id="safetyTitle" x="350" y="510" text-anchor="middle" dominant-baseline="central" fill="var(--success)">Bağımsız Güvenlik Katmanı</text>
  <text class="ts" id="safetyState" x="350" y="528" text-anchor="middle" dominant-baseline="central">Normal — chip'ten ve termistörden bağımsız, kendi ısı eşiğini izliyor</text>
</svg>
 
<div class="temp-row">
  <div class="temp-num" id="tempOut">25°</div>
  <div class="bar-wrap"><div class="bar-fill" id="tempBar"></div></div>
</div>
<div class="status-line" id="cycleOut">Kapalı</div>
<div class="status-strong" id="thermoOut">Denge: 25°</div>
 
<script>
let temp = 25, level = 0, running = false, timer = null, phase = 0, dataPhase = 0;
let safetyTripped = false, maxTemp = 55;
let steadyStates = [25, 0, 0, 0];
const RATIOS = [0, 0.33, 0.66, 1.0];
const rates = [0.02, 0.012, 0.02, 0.035];
const duties = [0, 3, 7, 10];
const lvlNames = ['kapalı','seviye 1','seviye 2','seviye 3'];
const AMBIENT = 25;
 
const wire12 = document.getElementById('wire12');
const resGroup = document.getElementById('resGroup');
const dataDot = document.getElementById('dataDot');
 
function recomputeSteadyStates(){
  for (let i=1;i<=3;i++){
    steadyStates[i] = AMBIENT + (maxTemp - AMBIENT) * RATIOS[i];
  }
  document.getElementById('ratioOut').textContent =
    'Seviye 1: ' + Math.round(steadyStates[1]) + '° (%33)  •  Seviye 2: ' + Math.round(steadyStates[2]) + '° (%66)  •  Seviye 3: ' + Math.round(steadyStates[3]) + '° (%100, max)';
}
 
function updateMax(v){
  maxTemp = Number(v);
  document.getElementById('maxOut').textContent = maxTemp + '°';
  recomputeSteadyStates();
  render(false);
}
 
function setLevel(l){
  level = l;
  document.getElementById('lvlLabel').textContent = lvlNames[l];
  [0,1,2,3].forEach(i => document.getElementById('lvl'+i).classList.toggle('active', i===l));
  render(false);
}
 
function resetSim(){
  temp = 25; level = 0; phase = 0; dataPhase = 0; safetyTripped = false;
  running = false; clearInterval(timer);
  document.getElementById('playBtn').textContent = '▶️ Başlat';
  setLevel(0);
  dataDot.setAttribute('opacity', '0');
  render(false);
}
 
function render(onNow){
  document.getElementById('tempOut').textContent = Math.round(temp) + '°';
  document.getElementById('tempBar').style.width = Math.min(100, Math.max(0, ((temp-15)/(maxTemp+10-15))*100)) + '%';
 
  const target = steadyStates[level];
  const dir = temp < target - 0.3 ? 'yükseliyor ↑' : (temp > target + 0.3 ? 'düşüyor ↓' : 'dengede →');
  document.getElementById('thermoOut').textContent =
    'Seviye ' + level + ' dengesi: ' + Math.round(target) + '° — şu an ' + Math.round(temp) + '°, ' + dir;
 
  document.getElementById('chipState').textContent =
    level === 0 ? 'bekliyor' : (onNow ? 'gate: açık' : 'gate: kapalı (PWM dilimi)');
 
  document.getElementById('mosState').textContent = onNow ? 'açık' : 'kapalı';
  document.getElementById('mosLabel').setAttribute('fill', onNow ? 'var(--accent)' : '');
  wire12.setAttribute('stroke', onNow ? 'var(--accent)' : 'var(--border)');
  wire12.setAttribute('stroke-width', onNow ? '4' : '3');
  resGroup.setAttribute('opacity', onNow ? '1' : '0.45');
  document.getElementById('gateLine').setAttribute('stroke', (level>0 && !safetyTripped) ? 'var(--accent)' : 'var(--border)');
  document.getElementById('cycleOut').textContent = level===0
    ? 'Kapalı — döngü çalışmıyor'
    : ('PWM: ' + duties[level] + '/10 dilim açık (görsel), gerçek eğilim denge sıcaklığına göre');
 
  const safetyBox = document.getElementById('safetyBox');
  const safetyTitle = document.getElementById('safetyTitle');
  const safetyState = document.getElementById('safetyState');
  if (safetyTripped) {
    safetyBox.setAttribute('stroke', 'var(--danger)');
    safetyTitle.setAttribute('fill', 'var(--danger)');
    safetyTitle.textContent = 'Bağımsız Güvenlik Katmanı — AÇTI';
    safetyState.textContent = Math.round(temp) + '° ≥ ' + maxTemp + '° eşiği — seviye ne olursa olsun akım kesildi';
  } else {
    safetyBox.setAttribute('stroke', 'var(--success)');
    safetyTitle.setAttribute('fill', 'var(--success)');
    safetyTitle.textContent = 'Bağımsız Güvenlik Katmanı';
    safetyState.textContent = 'Normal — chip\'ten ve termistörden bağımsız, ' + maxTemp + '° eşiğini izliyor';
  }
}
 
function tick(){
  phase = (phase + 1) % 10;
  dataPhase = (dataPhase + 1) % 10;
 
  const safetyReset = maxTemp - 8;
  if (temp >= maxTemp) safetyTripped = true;
  if (safetyTripped && temp < safetyReset) safetyTripped = false;
 
  const target = safetyTripped ? AMBIENT : steadyStates[level];
  const k = safetyTripped ? 0.03 : rates[level];
  temp += (target - temp) * k;
  temp = Math.max(15, Math.min(maxTemp + 10, temp));
 
  const onNow = !safetyTripped && level > 0 && (phase < duties[level]);
 
  const t = dataPhase / 10;
  const bx = 260 + (330-260) * (t < 0.5 ? t*2 : (1-t)*2);
  const by = 150 + (340-150) * (t < 0.5 ? t*2 : (1-t)*2);
  dataDot.setAttribute('cx', bx);
  dataDot.setAttribute('cy', by);
  dataDot.setAttribute('opacity', '1');
 
  render(onNow);
}
 
function toggleSim(){
  running = !running;
  const btn = document.getElementById('playBtn');
  if (running){
    btn.textContent = '⏸ Durdur';
    timer = setInterval(tick, 100);
  } else {
    btn.textContent = '▶️ Başlat';
    clearInterval(timer);
    dataDot.setAttribute('opacity', '0');
  }
}
 
recomputeSteadyStates();
setLevel(0);
render(false);
</script>
 
</body>
</html>
